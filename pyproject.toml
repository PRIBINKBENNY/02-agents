[project]
name = "long-horizon-agents"
version = "0.1.0"
description = "An agent that finishes multi-step tasks on its own, with parallel sub-agents in a sandbox."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6",
  "ddgs>=9",
]

[project.optional-dependencies]
e2b = ["e2b-code-interpreter>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
agent = "agents.cli:main"

[tool.setuptools]
packages = ["agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
